<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F95FF"/>
      <stop offset="1" stop-color="#1D5BD8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#F59E63" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E63" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="water" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#1BA3B8"/>
      <stop offset="0.55" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#0B3C4F"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="0.5" stop-color="#EEDFC4"/>
      <stop offset="1" stop-color="#CDB893"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB877"/>
      <stop offset="0.5" stop-color="#F0803A"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0803A"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="222" cy="222" r="128"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- backplate -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- handle -->
  <g filter="url(#soft)">
    <line x1="322" y1="322" x2="432" y2="432" stroke="#8A6E45" stroke-width="54" stroke-linecap="round"/>
    <line x1="322" y1="322" x2="428" y2="428" stroke="url(#ring)" stroke-width="42" stroke-linecap="round"/>
  </g>

  <!-- lens water -->
  <circle cx="222" cy="222" r="128" fill="url(#water)" filter="url(#inner)"/>

  <!-- inside the lens -->
  <g clip-path="url(#lensClip)">
    <!-- light caustics -->
    <ellipse cx="300" cy="300" rx="120" ry="60" fill="#FFFFFF" fill-opacity="0.04" transform="rotate(-30 300 300)"/>
    <!-- bubbles -->
    <circle cx="298" cy="156" r="7" fill="none" stroke="#CFF5FA" stroke-width="2.5" stroke-opacity="0.8"/>
    <circle cx="316" cy="132" r="5" fill="none" stroke="#CFF5FA" stroke-width="2.2" stroke-opacity="0.7"/>
    <circle cx="326" cy="112" r="3.2" fill="#CFF5FA" fill-opacity="0.6"/>

    <!-- minnow -->
    <g transform="translate(222 222) scale(1.1) translate(-216 -220)">
      <!-- tail -->
      <path d="M288 222 C306 206 322 190 346 182 C335 203 335 241 346 262 C322 254 306 238 288 222 Z" fill="url(#fin)"/>
      <!-- dorsal fin -->
      <path d="M196 184 C214 158 248 158 266 190 L196 190 Z" fill="url(#fin)"/>
      <!-- pelvic fin -->
      <path d="M200 254 C214 272 236 272 252 256 L200 252 Z" fill="url(#fin)"/>
      <!-- body -->
      <path d="M112 222 C136 184 206 172 298 212 C306 216 306 228 298 232 C206 272 136 260 112 222 Z" fill="url(#fish)"/>
      <!-- belly highlight -->
      <path d="M128 226 C160 250 210 256 280 236 C210 262 160 258 128 226 Z" fill="#FFF1E3" fill-opacity="0.35"/>
      <!-- lateral line -->
      <path d="M140 220 C190 212 240 212 292 222" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>
      <!-- gill -->
      <path d="M160 204 C152 214 152 230 160 240" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>
      <!-- eye -->
      <circle cx="146" cy="214" r="10" fill="#FFF8EC"/>
      <circle cx="148" cy="214" r="5.5" fill="#1B1F2A"/>
      <circle cx="150.5" cy="211.5" r="1.8" fill="#FFFFFF"/>
    </g>

    <!-- glass reflection -->
    <path d="M130 150 C150 118 190 100 236 100" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-opacity="0.22"/>
    <path d="M114 196 C116 186 120 176 126 168" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-opacity="0.16"/>
  </g>

  <!-- ring -->
  <circle cx="222" cy="222" r="128" fill="none" stroke="#8A6E45" stroke-width="40"/>
  <circle cx="222" cy="222" r="128" fill="none" stroke="url(#ring)" stroke-width="30"/>
  <circle cx="222" cy="222" r="114" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>
</svg>
