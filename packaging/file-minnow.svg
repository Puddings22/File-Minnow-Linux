<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- File Minnow: a magnifying glass over a minnow. Plain shapes and
       gradients only (no filters), so every SVG renderer draws it the same. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F95FF"/>
      <stop offset="1" stop-color="#1D5BD8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.36" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#F4FDFF"/>
      <stop offset="0.5" stop-color="#BDEDF7"/>
      <stop offset="1" stop-color="#5FBCD6"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6DF"/>
      <stop offset="0.45" stop-color="#E9C987"/>
      <stop offset="1" stop-color="#A97C34"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DF"/>
      <stop offset="0.5" stop-color="#E2BE78"/>
      <stop offset="1" stop-color="#9A6E2A"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9B5B32"/>
      <stop offset="0.4" stop-color="#6E3A1C"/>
      <stop offset="1" stop-color="#3E1E0C"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB877"/>
      <stop offset="0.5" stop-color="#F0803A"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0803A"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="212" cy="212" r="123"/></clipPath>
  </defs>

  <!-- backplate -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- shadow of the glass on the backplate -->
  <g fill="#06205A" fill-opacity="0.22">
    <circle cx="212" cy="228" r="165"/>
    <rect x="196" y="-33" width="130" height="66" rx="33" transform="translate(212 228) rotate(45)"/>
  </g>

  <!-- handle: neck, collar and grip, along the 45 degree axis -->
  <g transform="translate(212 212) rotate(45)">
    <rect x="140" y="-19" width="56" height="38" fill="#5A3C12"/>
    <rect x="140" y="-14" width="56" height="28" fill="url(#collar)"/>
    <rect x="180" y="-37" width="26" height="74" rx="9" fill="#5A3C12"/>
    <rect x="183" y="-33" width="20" height="66" rx="7" fill="url(#collar)"/>
    <rect x="200" y="-34" width="128" height="68" rx="34" fill="#5A3C12"/>
    <rect x="204" y="-30" width="120" height="60" rx="30" fill="url(#grip)"/>
    <rect x="216" y="-22" width="92" height="10" rx="5" fill="#FFE2C4" fill-opacity="0.22"/>
  </g>

  <!-- glass -->
  <circle cx="212" cy="212" r="124" fill="url(#glass)"/>

  <!-- what the lens magnifies -->
  <g clip-path="url(#lens)">
    <!-- bubbles -->
    <circle cx="250" cy="124" r="8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.85"/>
    <circle cx="268" cy="104" r="5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.75"/>

    <!-- minnow, larger than the lens: the tail runs past the rim -->
    <g transform="translate(212 216) scale(1.08) translate(-216 -222)">
      <path d="M288 222 C306 206 322 190 346 182 C335 203 335 241 346 262 C322 254 306 238 288 222 Z" fill="url(#fin)"/>
      <path d="M196 184 C214 158 248 158 266 190 L196 190 Z" fill="url(#fin)"/>
      <path d="M200 254 C214 272 236 272 252 256 L200 252 Z" fill="url(#fin)"/>
      <path d="M112 222 C136 184 206 172 298 212 C306 216 306 228 298 232 C206 272 136 260 112 222 Z" fill="url(#fish)"/>
      <path d="M128 226 C160 250 210 256 280 236 C210 262 160 258 128 226 Z" fill="#FFF1E3" fill-opacity="0.35"/>
      <path d="M140 220 C190 212 240 212 292 222" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>
      <path d="M160 204 C152 214 152 230 160 240" fill="none" stroke="#7C2D12" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>
      <circle cx="146" cy="214" r="11" fill="#FFF8EC"/>
      <circle cx="148" cy="214" r="6" fill="#1B1F2A"/>
      <circle cx="150.5" cy="211.5" r="2" fill="#FFFFFF"/>
    </g>

    <!-- depth at the far edge of the glass, light on the near edge -->
    <circle cx="212" cy="212" r="116" fill="none" stroke="#0B6F8C" stroke-width="14" stroke-opacity="0.18" stroke-linecap="round" stroke-dasharray="170 559" stroke-dashoffset="-26"/>
    <path d="M117 176 A102 102 0 0 1 176 117" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-opacity="0.6"/>
    <circle cx="111" cy="204" r="6" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>

  <!-- rim -->
  <circle cx="212" cy="212" r="140" fill="none" stroke="#5A3C12" stroke-width="44"/>
  <circle cx="212" cy="212" r="140" fill="none" stroke="url(#rim)" stroke-width="34"/>
  <path d="M80 164 A140 140 0 0 1 164 80" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.75"/>
  <circle cx="212" cy="212" r="124" fill="none" stroke="#5A3C12" stroke-width="3" stroke-opacity="0.55"/>
</svg>
